<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>English Unlocked — Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- the episode list (titles for the outro's "Next episode" line) -->
<script src="series.js"></script>
<script>
  // Pick the episode from ?ep=NN (default 01). Babel transforms text/babel
  // scripts in document order, so we inject engine → data → ui here in <body>,
  // BEFORE the inline <App> script below, and they run in that order.
  (function () {
    var q = new URLSearchParams(location.search);
    var raw = q.get("ep") || "01";
    var ep = String(raw).replace(/[^0-9]/g, "").padStart(2, "0") || "01";
    // ?ui=v3 rolls back to the original faceless layout; v4 (video-first) is default.
    var ui = (q.get("ui") || "v4").toLowerCase() === "v3" ? "v3" : "v4";
    window.__EU_EP = ep;
    window.__EU_UI = ui;
    function babel(src) { document.write('<script type="text/babel" src="' + src + '"><\/script>'); }
    babel("animations.jsx");        // Stage, Sprite, useTime, Easing, clamp …
    babel("episode-engine.jsx");    // the shared timing builder
    babel("data-ep" + ep + ".jsx"); // this episode's content
    if (ui === "v4") babel("slot.jsx");   // the shared camera-slot system
    babel("ui-" + ui + ".jsx");     // the visual components
    if (ui === "v4") babel("fx-v4.jsx");  // motion layer (on with ?fx=1)
    if (ui === "v4") babel("director.jsx"); // camera director (on with ?dir=1)
  })();
</script>

<script type="text/babel">
  // ?render=1 → clean render mode: no playback bar, no autoplay, no persistence.
  // The offline renderer (render/render.mjs) drives the timeline via window.__deckControl.
  const RENDER = new URLSearchParams(location.search).has("render");
  const EP = window.__EU_EP || "01";
  const UI = window.__EU_UI || "v4";
  const Episode = UI === "v3" ? window.EpisodeThreeV3 : window.EpisodeV4;

  function App() {
    return (
      <Stage
        width={1920} height={1080}
        duration={window.EPISODE.duration}
        background="#0a0e12"
        chrome={!RENDER}
        autoplay={!RENDER}
        loop={!RENDER}
        persistKey={RENDER ? ("eu-ep" + EP + "-render") : ("english-unlocked-ep" + EP)}>
        <Episode />
      </Stage>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  window.__RENDER_MODE = RENDER;
  document.title = "English Unlocked — Ep " + EP + (RENDER ? " (render)" : "");
</script>
<script>
  // In-tab quick exporter (only when NOT in offline render mode)
  window.addEventListener("load", function () {
    if (new URLSearchParams(location.search).has("render")) return;
    var s = document.createElement("script");
    s.src = "recorder.jsx";
    setTimeout(function () { document.body.appendChild(s); }, 800);
  });
</script>
</body>
</html>
